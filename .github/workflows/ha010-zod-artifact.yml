name: HA-010 Official Zod Gate

on:
  push:
    branches:
      - test/ha010-zod-artifact

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Download official npm tarball
        run: npm pack zod@4.4.3 --ignore-scripts

      - name: Verify lockfile integrity and package version
        shell: bash
        run: |
          set -euo pipefail
          expected='ytENFjIJFl2UwYglde2jchW2Hwm4GJFLDiSXWdTrJQBIN9Fcyp7n4DhxJEiWNAJMV1/BqWfW/kkg71UDcHJyTQ=='
          actual="$(openssl dgst -sha512 -binary zod-4.4.3.tgz | openssl base64 -A)"
          test "$actual" = "$expected"
          tar -xOf zod-4.4.3.tgz package/package.json > zod-package.json
          node -e "const p=require('./zod-package.json'); if(p.name!=='zod'||p.version!=='4.4.3') throw new Error(JSON.stringify(p)); console.log(p.name+'@'+p.version)"
          printf '%s  %s\n' "$actual" zod-4.4.3.tgz > zod-4.4.3.sha512

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: zod-4.4.3-official
          path: |
            zod-4.4.3.tgz
            zod-4.4.3.sha512
            zod-package.json
          if-no-files-found: error
          retention-days: 1

  verify-private-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check private repository access
        id: access
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/heuratlas-repo.json -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/jtelcc/HeurAtlas)"
          echo "HTTP status: ${status}"
          test "${status}" = '200'

      - name: Download PR branch source without publishing it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ha010
          curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -o /tmp/ha010.zip \
            https://api.github.com/repos/jtelcc/HeurAtlas/zipball/task/HA-010/exploration-state-contract
          unzip -q /tmp/ha010.zip -d /tmp/ha010
          root="$(find /tmp/ha010 -mindepth 1 -maxdepth 1 -type d | head -1)"
          test -n "${root}"
          mv "${root}" /tmp/heuratlas

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: pnpm
          cache-dependency-path: /tmp/heuratlas/pnpm-lock.yaml

      - name: Enable pinned pnpm
        working-directory: /tmp/heuratlas
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --version

      - name: Install official dependencies
        working-directory: /tmp/heuratlas
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify official Zod identity
        working-directory: /tmp/heuratlas
        run: |
          node --input-type=module -e "import pkg from './node_modules/zod/package.json' with { type: 'json' }; if (pkg.version !== '4.4.3') throw new Error('Expected zod 4.4.3, got ' + pkg.version); console.log('zod=' + pkg.version)"

      - name: Preserve committed schemas
        run: cp -R /tmp/heuratlas/schemas /tmp/heuratlas-schemas-before

      - name: Build
        working-directory: /tmp/heuratlas
        run: pnpm run build

      - name: Regenerate schemas
        working-directory: /tmp/heuratlas
        run: pnpm run schemas

      - name: Assert generated schemas are unchanged
        run: diff -ru /tmp/heuratlas-schemas-before /tmp/heuratlas/schemas

      - name: Full verification
        working-directory: /tmp/heuratlas
        run: pnpm run verify
